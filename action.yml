name: DevFlow performance check
description: Run a DevFlow workload against an existing server and publish its JSON report.
inputs:
  api-url:
    description: DevFlow API URL, for example https://devflow.example/api/v1
    required: true
  token:
    description: DevFlow API bearer token
    required: true
  config:
    description: Path to a DevFlow run configuration JSON file
    required: true
  github-token:
    description: Token used to create or update the pull request comment
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEVFLOW_API: ${{ inputs.api-url }}
        DEVFLOW_TOKEN: ${{ inputs.token }}
        DEVFLOW_CONFIG: ${{ inputs.config }}
      run: node "$GITHUB_ACTION_PATH/bin/devflow.js" run --config "$GITHUB_WORKSPACE/$DEVFLOW_CONFIG" --api "$DEVFLOW_API" --token "$DEVFLOW_TOKEN" --json > "$GITHUB_WORKSPACE/devflow-result.json"
    - id: result-artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: devflow-result
        path: ${{ github.workspace }}/devflow-result.json
        if-no-files-found: ignore
    - uses: actions/github-script@v7
      if: always() && github.event_name == 'pull_request' && inputs.github-token != ''
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const { buildPullRequestComment, upsertPullRequestComment } = require(`${process.env.GITHUB_ACTION_PATH}/tools/github-action-comment.cjs`);
          const file = `${process.env.GITHUB_WORKSPACE}/devflow-result.json`;
          let report = null;
          if (fs.existsSync(file)) {
            try { report = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
          }
          const body = buildPullRequestComment(report, process.env.DEVFLOW_ARTIFACT_URL);
          await upsertPullRequestComment(github, context, body);
      env:
        DEVFLOW_ARTIFACT_URL: ${{ steps.result-artifact.outputs.artifact-url }}
