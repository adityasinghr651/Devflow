openapi: 3.1.0
info:
  title: DevFlow API
  version: 1.0.0
  description: Authenticated self-hosted load testing API. Prefer /api/v1; /api is a deprecated compatibility alias.
servers:
  - url: http://localhost:4000/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses: {'200': {description: Service health}}
  /ready:
    get:
      security: []
      responses: {'200': {description: Ready}, '503': {description: Storage unavailable}}
  /auth/register:
    post:
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, email, password], properties: {name: {type: string}, email: {type: string, format: email}, password: {type: string, minLength: 10, maxLength: 128}}}}}
      responses: {'201': {description: Account created}, '400': {description: Invalid input}, '409': {description: Registration rejected}}
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [email, password], properties: {email: {type: string}, password: {type: string}}}}}
      responses: {'200': {description: Session token}, '401': {description: Invalid credentials}}
  /auth/me:
    get:
      responses: {'200': {description: Current user}, '401': {description: Unauthorized}}
  /auth/logout:
    post:
      responses: {'200': {description: Logged out}}
  /auth/oauth:
    post:
      security: []
      responses: {'400': {description: Email claims are rejected; use authorization-code flow}}
  /auth/oauth/{provider}/start:
    get:
      security: []
      parameters: [{in: path, name: provider, required: true, schema: {type: string, enum: [github, google]}}]
      responses: {'302': {description: Redirect to provider consent}, '503': {description: OAuth is not configured}}
  /auth/oauth/{provider}/callback:
    get:
      security: []
      parameters: [{in: path, name: provider, required: true, schema: {type: string, enum: [github, google]}}, {in: query, name: code, required: true, schema: {type: string}}, {in: query, name: state, required: true, schema: {type: string}}]
      responses: {'303': {description: Verified provider session redirected to the frontend}, '400': {description: Invalid state or provider response}, '409': {description: Existing account needs explicit linking}}
    post:
      security: []
      responses: {'200': {description: OAuth code exchange result}, '400': {description: Invalid state or code}, '409': {description: Existing account needs explicit linking}}
  /auth/demo:
    post:
      security: []
      responses: {'201': {description: HttpOnly cookie backed 24 hour demo session}, '429': {description: Rate limited}}
  /auth/demo/logout:
    post:
      security: []
      responses: {'200': {description: Demo cookie cleared}}
  /audit-events:
    get:
      responses: {'200': {description: Owner-scoped audit events}}
  /targets:
    get:
      responses: {'200': {description: Owner-scoped targets}}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, url], properties: {name: {type: string}, url: {type: string, format: uri}, environment: {type: string}}}}}
      responses: {'201': {description: Target created}, '400': {description: Invalid target}}
  /targets/{id}:
    delete:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Deleted}, '404': {description: Not found}, '409': {description: Active run exists}}
  /targets/{id}/verify:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Verified}, '400': {description: Ownership verification failed}}
  /runs:
    get:
      parameters: [{in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}, {in: query, name: offset, schema: {type: integer, minimum: 0}}]
      responses: {'200': {description: Owner-scoped paginated runs; X-Total-Count and X-Next-Offset headers describe pagination}}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [targetId, concurrency, durationSec], properties: {targetId: {type: string}, path: {type: string}, method: {type: string}, concurrency: {type: integer}, durationSec: {type: integer}, workerCount: {type: integer}, authorized: {type: boolean}}}}}
      responses: {'202': {description: Run queued}, '400': {description: Invalid run}, '429': {description: Quota exceeded}}
  /runs/{id}:
    get:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Run details}, '404': {description: Not found}}
    delete:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Deleted by Pro owner or administrator}, '403': {description: Requires Pro or Admin}, '404': {description: Not found or not owned}}
  /runs/{id}/regression:
    get:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Statistical regression verdict and baseline explanation}, '404': {description: Not found}}
  /runs/{id}/cancel:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Cancellation requested}, '409': {description: Run is terminal}}
  /runs/{id}/events-ticket:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Single-use stream ticket}, '404': {description: Not found}}
  /runs/{id}/events:
    get:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: query, name: ticket, schema: {type: string}}]
      responses: {'200': {description: Server-sent events}, '401': {description: Invalid stream credentials}}
  /campaigns:
    get:
      responses: {'200': {description: Owner-scoped benchmark campaigns}}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [targetId, stageConcurrency, workerCount, authorized], properties: {name: {type: string}, targetId: {type: string}, path: {type: string}, method: {type: string}, stageConcurrency: {type: array, minItems: 4, maxItems: 4, items: {type: integer, minimum: 1, maximum: 20}}, workerCount: {type: integer, enum: [1, 2, 4]}, timeoutMs: {type: integer}, warmupSec: {type: integer}, rampUpSec: {type: integer}, maxErrorRatePercent: {type: number}, authorized: {type: boolean}}}}}
      responses: {'201': {description: Campaign created}, '400': {description: Invalid campaign settings}, '403': {description: Target authorization required}}
  /campaigns/{id}:
    get:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Owner-scoped campaign and persisted stage reports}, '404': {description: Not found}}
  /campaigns/{id}/start:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'202': {description: First stage started}, '409': {description: Campaign is not startable}}
  /campaigns/{id}/advance:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'202': {description: Approved next stage started}, '409': {description: Stage approval unavailable}}
  /campaigns/{id}/retry:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'202': {description: Failed stage retry started}, '409': {description: Stage is not retryable}}
  /campaigns/{id}/cancel:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Cancellation requested}, '409': {description: Campaign is not active}}
  /campaigns/{id}/stages/{stageNumber}/report:
    get:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: path, name: stageNumber, required: true, schema: {type: integer, minimum: 1, maximum: 4}}]
      responses: {'200': {description: Downloadable persisted stage report}, '404': {description: Report unavailable}}
  /admin/stats:
    get:
      responses: {'200': {description: Platform aggregate totals by tier}, '403': {description: Admin role required}}
  /admin/users:
    get:
      parameters: [{in: query, name: limit, schema: {type: integer, maximum: 100}}, {in: query, name: offset, schema: {type: integer, minimum: 0}}]
      responses: {'200': {description: Safe user list}, '403': {description: Admin role required}}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, email, password], properties: {name: {type: string}, email: {type: string, format: email}, password: {type: string, minLength: 10}}}}}
      responses: {'201': {description: Admin account created}, '400': {description: Invalid input}, '403': {description: Admin role required}, '409': {description: Email already exists}}
  /admin/users/{id}/tier:
    patch:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [tier], properties: {tier: {type: string, enum: [free, paid, admin]}}}}}
      responses: {'200': {description: User tier changed}, '403': {description: Admin role required}, '404': {description: User not found}}
  /admin/runs/{id}:
    delete:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Any finished run removed}, '403': {description: Admin role required}, '404': {description: Run not found}, '409': {description: Active run cannot be deleted}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
