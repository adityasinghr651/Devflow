<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">DevFlow System Architecture</title>
  <desc id="desc">Single-host process architecture: React UI, Express API, runner manager, coordinator, multi-worker child processes, and target telemetry.</desc>
  <defs>
    <style>
      @keyframes flowDash {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .flow-anim { stroke-dasharray: 6 6; animation: flowDash 1.2s linear infinite; }
      .telemetry-anim { stroke-dasharray: 6 6; animation: flowDash 1.0s linear infinite; }
      .live-dot { animation: pulseDot 2s ease-in-out infinite; }
    </style>

    <marker id="arrowLime" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#C6F432"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#71717A"/>
    </marker>

    <linearGradient id="sysBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0C"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>

    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#17171B"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="640" rx="18" fill="url(#sysBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <g transform="translate(48, 52)" font-family="Inter, -apple-system, sans-serif">
    <text x="0" y="0" fill="#FFFFFF" font-size="24" font-weight="800" letter-spacing="-0.5">
      DevFlow Single-Host Architecture &amp; Execution Pipeline
    </text>
    <text x="0" y="26" fill="#A1A1AA" font-size="14" font-weight="400">
      All runner and worker processes run isolated on a single machine. The target can be local loopback or an authorized remote API.
    </text>
  </g>

  <!-- DEVFLOW HOST Container Box -->
  <rect x="36" y="112" width="1128" height="310" rx="16" fill="url(#hostGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="36" y="112" width="1128" height="310" rx="16" fill="none" stroke="rgba(198,244,50,0.2)" stroke-dasharray="6 6"/>
  <g transform="translate(58, 140)" font-family="Inter, -apple-system, sans-serif">
    <circle cx="0" cy="-4" r="3.5" fill="#C6F432" class="live-dot"/>
    <text x="12" y="0" fill="#C6F432" font-size="11" font-weight="700" letter-spacing="1">DEVFLOW ISOLATED HOST ENVIRONMENT</text>
  </g>

  <!-- Process Blocks Inside Host -->
  <g font-family="Inter, -apple-system, sans-serif">
    <!-- Block 1: Browser UI -->
    <g transform="translate(64, 180)">
      <rect width="190" height="120" rx="12" fill="#0E0E10" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect width="190" height="4" rx="2" fill="#C6F432"/>
      <text x="20" y="34" fill="#FFFFFF" font-size="16" font-weight="700">Browser UI</text>
      <text x="20" y="60" fill="#A1A1AA" font-size="12">React 19 + Vite 8</text>
      <text x="20" y="82" fill="#71717A" font-size="11">Live telemetry stream</text>
      <text x="20" y="102" fill="#C6F432" font-size="10" font-family="monospace">JWT Session Auth</text>
    </g>

    <!-- Block 2: Express API -->
    <g transform="translate(315, 180)">
      <rect width="200" height="120" rx="12" fill="#0E0E10" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect width="200" height="4" rx="2" fill="#38BDF8"/>
      <text x="20" y="34" fill="#FFFFFF" font-size="16" font-weight="700">Express API</text>
      <text x="20" y="60" fill="#A1A1AA" font-size="12">Port 4000 (ESM)</text>
      <text x="20" y="82" fill="#71717A" font-size="11">Auth • Targets • Runs</text>
      <text x="20" y="102" fill="#38BDF8" font-size="10" font-family="monospace">Zero-polling SSE Feed</text>
    </g>

    <!-- Block 3: Runner Manager & Coordinator -->
    <g transform="translate(576, 180)">
      <rect width="210" height="120" rx="12" fill="#0E0E10" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect width="210" height="4" rx="2" fill="#A78BFA"/>
      <text x="20" y="34" fill="#FFFFFF" font-size="16" font-weight="700">Runner Manager</text>
      <text x="20" y="60" fill="#A1A1AA" font-size="12">Queue &amp; Coordinator</text>
      <text x="20" y="82" fill="#71717A" font-size="11">Workload partitioning</text>
      <text x="20" y="102" fill="#A78BFA" font-size="10" font-family="monospace">O(1) Bounded Histogram</text>
    </g>

    <!-- Block 4: Node Child Workers -->
    <g transform="translate(846, 166)">
      <rect width="210" height="148" rx="12" fill="#0E0E10" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect width="210" height="4" rx="2" fill="#10B981"/>
      <text x="20" y="34" fill="#FFFFFF" font-size="16" font-weight="700">Node Workers</text>
      <text x="20" y="60" fill="#A1A1AA" font-size="12">1, 2, or 4 child processes</text>
      <text x="20" y="82" fill="#71717A" font-size="11">HTTP Load Generation</text>
      <text x="20" y="104" fill="#10B981" font-size="11" font-weight="600">IPC Snapshots &amp; Timings</text>
      <text x="20" y="126" fill="#71717A" font-size="10" font-family="monospace">Out-of-process Loop</text>
    </g>

    <!-- Aggregator Bar Below Coordinator -->
    <g transform="translate(576, 334)">
      <rect width="320" height="60" rx="10" fill="#141416" stroke="rgba(198,244,50,0.3)" stroke-width="1"/>
      <text x="20" y="26" fill="#FFFFFF" font-size="13" font-weight="700">Coordinator Metric Aggregation</text>
      <text x="20" y="46" fill="#A1A1AA" font-size="11" font-family="monospace">Merged Latency Histograms · IPC Sync</text>
    </g>

    <!-- Pipeline Connectors with Animated Dashes -->
    <!-- UI to API -->
    <path d="M254 225 H307" stroke="#C6F432" stroke-width="2" class="flow-anim" marker-end="url(#arrowLime)"/>
    <text x="264" y="215" fill="#A1A1AA" font-size="10" font-family="monospace">HTTP POST</text>

    <!-- SSE Back to UI -->
    <path d="M315 265 H262" stroke="#38BDF8" stroke-width="2" class="telemetry-anim" marker-end="url(#arrowBlue)"/>
    <text x="270" y="282" fill="#38BDF8" font-size="10" font-family="monospace">SSE Stream</text>

    <!-- API to Runner Manager -->
    <path d="M515 240 H568" stroke="#FFFFFF" stroke-width="2" class="flow-anim" marker-end="url(#arrowGray)"/>
    <text x="524" y="228" fill="#A1A1AA" font-size="10" font-family="monospace">enqueue</text>

    <!-- Runner to Workers -->
    <path d="M786 240 H838" stroke="#FFFFFF" stroke-width="2" class="flow-anim" marker-end="url(#arrowGray)"/>
    <text x="792" y="228" fill="#A1A1AA" font-size="10" font-family="monospace">fork + IPC</text>

    <!-- IPC from Workers to Coordinator -->
    <path d="M846 280 H816 V364 H896" fill="none" stroke="#10B981" stroke-width="2" class="telemetry-anim"/>
    <text x="710" y="356" fill="#10B981" font-size="10" font-family="monospace">IPC progress &amp; histograms</text>
  </g>

  <!-- External Elements Below Host -->
  <g font-family="Inter, -apple-system, sans-serif">
    <!-- Storage Adapter -->
    <g transform="translate(315, 470)">
      <rect width="370" height="110" rx="14" fill="#141416" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect width="370" height="4" rx="2" fill="#71717A"/>
      <text x="24" y="36" fill="#FFFFFF" font-size="16" font-weight="700">Storage Adapter Layer</text>
      <text x="24" y="62" fill="#A1A1AA" font-size="12">PostgreSQL (with versioned SQL migrations)</text>
      <text x="24" y="84" fill="#71717A" font-size="11">Zero-config Local JSON file fallback (<tspan font-family="monospace">store.json</tspan>)</text>
    </g>

    <!-- Flow: API to Storage -->
    <path d="M415 300 V462" stroke="#FFFFFF" stroke-width="2" class="flow-anim" marker-end="url(#arrowGray)"/>
    <text x="424" y="420" fill="#A1A1AA" font-size="10" font-family="monospace">read/write</text>

    <!-- Flow: Coordinator to Storage -->
    <path d="M650 394 V462" stroke="#C6F432" stroke-width="2" class="telemetry-anim" marker-end="url(#arrowLime)"/>
    <text x="658" y="420" fill="#C6F432" font-size="10" font-family="monospace">persist run</text>

    <!-- HTTP Target Box -->
    <g transform="translate(955, 470)">
      <rect width="200" height="110" rx="14" fill="#141416" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect width="200" height="4" rx="2" fill="#F59E0B"/>
      <text x="20" y="36" fill="#FFFFFF" font-size="16" font-weight="700">HTTP Target</text>
      <text x="20" y="62" fill="#A1A1AA" font-size="12">Local loopback (5050)</text>
      <text x="20" y="84" fill="#F59E0B" font-size="11">Authorized Remote API</text>
    </g>

    <!-- Flow: Worker to HTTP Target -->
    <path d="M1050 314 V462" stroke="#F59E0B" stroke-width="2" class="flow-anim"/>
    <text x="1058" y="420" fill="#F59E0B" font-size="10" font-family="monospace">HTTP traffic</text>
  </g>

  <!-- Footer Annotation -->
  <text x="48" y="616" fill="#71717A" font-size="12" font-family="monospace">
    Legend: <tspan fill="#C6F432">■ Electric Lime:</tspan> UI triggers &amp; run persistence · <tspan fill="#38BDF8">■ Cyan:</tspan> Live SSE streams · <tspan fill="#10B981">■ Emerald:</tspan> Worker IPC &amp; histograms · <tspan fill="#F59E0B">■ Amber:</tspan> Target traffic
  </text>
</svg>
