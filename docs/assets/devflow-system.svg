<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">DevFlow system design</title>
  <desc id="desc">A single-host flow from the React browser app through the Express API and runner manager to Node child workers and an HTTP target. Workers return progress and results; the API streams updates and stores records in PostgreSQL or JSON.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0284c7"/></marker>
    <style>
      .title{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .sub{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .head{font:650 16px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .meta{font:13px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .label{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .telemetry{fill:none;stroke:#0284c7;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#f8fafc"/>
  <text x="48" y="54" class="title">How a DevFlow run moves through the system</text>
  <text x="48" y="80" class="sub">All application and worker processes run on one host. The target may be local or an authorized remote HTTP service.</text>

  <rect x="36" y="116" width="1128" height="300" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-dasharray="6 5"/>
  <text x="58" y="145" class="label" font-weight="700">DEVFLOW HOST</text>

  <g>
    <rect x="64" y="194" width="190" height="112" rx="12" class="card"/>
    <rect x="64" y="194" width="190" height="7" rx="4" fill="#0284c7"/>
    <text x="84" y="232" class="head">Browser UI</text>
    <text x="84" y="257" class="meta">React + Vite</text>
    <text x="84" y="281" class="meta">JWT session · live view</text>

    <rect x="315" y="194" width="200" height="112" rx="12" class="card"/>
    <rect x="315" y="194" width="200" height="7" rx="4" fill="#6366f1"/>
    <text x="335" y="232" class="head">Express API</text>
    <text x="335" y="257" class="meta">Auth · targets · runs</text>
    <text x="335" y="281" class="meta">SSE endpoint</text>

    <rect x="576" y="194" width="210" height="112" rx="12" class="card"/>
    <rect x="576" y="194" width="210" height="7" rx="4" fill="#7c3aed"/>
    <text x="596" y="232" class="head">Runner manager</text>
    <text x="596" y="257" class="meta">Queue · coordinator</text>
    <text x="596" y="281" class="meta">Partitions workload</text>

    <rect x="846" y="180" width="210" height="140" rx="12" class="card"/>
    <rect x="846" y="180" width="210" height="7" rx="4" fill="#059669"/>
    <text x="866" y="217" class="head">Node child workers</text>
    <text x="866" y="243" class="meta">1, 2, or 4 processes</text>
    <text x="866" y="267" class="meta">HTTP requests + timings</text>
    <text x="866" y="291" class="meta">Progress over IPC</text>

    <rect x="576" y="343" width="300" height="55" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="596" y="367" class="head" font-size="14">Coordinator aggregation</text>
    <text x="596" y="387" class="meta">Progress snapshots · merged latency histogram</text>

    <path d="M254 235H306" class="flow"/>
    <text x="260" y="221" class="label">HTTP</text>
    <path d="M315 271H262" class="telemetry"/>
    <text x="270" y="291" class="label">SSE</text>
    <path d="M515 249H567" class="flow"/>
    <text x="520" y="235" class="label">enqueue</text>
    <path d="M786 249H838" class="flow"/>
    <text x="790" y="235" class="label">fork + IPC</text>
    <path d="M846 291H816V370H868" class="telemetry"/>
    <text x="708" y="360" class="label">IPC progress + summaries</text>
  </g>

  <g>
    <rect x="955" y="470" width="200" height="96" rx="12" fill="#fff" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="955" y="470" width="200" height="7" rx="4" fill="#d97706"/>
    <text x="975" y="510" class="head">HTTP target</text>
    <text x="975" y="535" class="meta">Requests and responses</text>
    <path d="M1050 320v141" class="flow"/>
    <text x="1064" y="414" class="label">HTTP</text>

    <rect x="315" y="470" width="370" height="96" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="315" y="470" width="370" height="7" rx="4" fill="#475569"/>
    <text x="337" y="510" class="head">Storage adapter</text>
    <text x="337" y="536" class="meta">PostgreSQL + migrations, or local JSON file</text>
    <path d="M415 306v147" class="flow"/>
    <text x="428" y="426" class="label">read / write</text>
    <path d="M650 398v56" class="telemetry"/>
    <text x="665" y="433" class="label">persist final metrics</text>
  </g>

  <text x="48" y="610" class="sub">Solid arrows show requests and storage operations. Dashed blue arrows show telemetry and final results.</text>
</svg>
