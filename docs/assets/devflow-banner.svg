<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DevFlow — High-Performance API Load Testing</title>
  <desc id="desc">Modern, self-hosted API load testing and resilience benchmarking platform with bounded-memory telemetry.</desc>
  <defs>
    <style>
      @keyframes waveFlow {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.04); }
      }
      @keyframes packetRun {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes livePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .wave-path { animation: waveFlow 12s ease-in-out infinite; }
      .ambient-halo { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 900px 180px; }
      .packet-line { stroke-dasharray: 6 6; animation: packetRun 1.2s linear infinite; }
      .live-dot { animation: livePulse 2s ease-in-out infinite; }
    </style>

    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0C"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#0B0B0C"/>
    </linearGradient>

    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6F432"/>
      <stop offset="100%" stop-color="#E2FA75"/>
    </linearGradient>

    <linearGradient id="auroraWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6F432" stop-opacity="0"/>
      <stop offset="30%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C6F432" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C6F432" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="radialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6F432" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B0B0C" stop-opacity="0"/>
    </radialGradient>

    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1200" height="360" rx="20" fill="url(#obsidianBg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#techGrid)"/>
  <rect width="1200" height="360" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Ambient Radial Aura -->
  <circle cx="890" cy="180" r="240" fill="url(#radialGlow)" class="ambient-halo"/>

  <!-- Shimmering Aurora Wave Curves -->
  <g class="wave-path" opacity="0.85">
    <path d="M-100 280 C 200 210, 480 340, 780 260 C 1080 180, 1260 300, 1400 240" fill="none" stroke="url(#auroraWave)" stroke-width="3" filter="url(#glowBlur)"/>
    <path d="M-80 310 C 220 250, 500 370, 800 290 C 1100 210, 1280 330, 1420 270" fill="none" stroke="url(#auroraWave)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Left Content: Brand & Value Proposition -->
  <g font-family="Inter, -apple-system, system-ui, sans-serif">
    <!-- Top Pill Badge -->
    <g transform="translate(64, 48)">
      <rect width="280" height="28" rx="14" fill="rgba(20,20,22,0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#C6F432" class="live-dot"/>
      <text x="28" y="18" fill="#FFFFFF" font-size="11" font-weight="600" letter-spacing="0.5">DEVFLOW 2.0 • HIGH-PERFORMANCE</text>
    </g>

    <!-- Main Headline with Italic Lime Accent -->
    <text x="64" y="128" fill="#FFFFFF" font-size="44" font-weight="800" letter-spacing="-1.5">
      Test. Load. <tspan fill="url(#limeGrad)" font-style="italic" font-family="'Newsreader', Georgia, serif" font-weight="500">Analyze.</tspan>
    </text>

    <!-- Subtitle -->
    <text x="64" y="168" fill="#A1A1AA" font-size="16" font-weight="400" line-height="1.5">
      Modern, self-hosted API load testing and resilience benchmarking platform.
    </text>
    <text x="64" y="194" fill="#71717A" font-size="14" font-weight="400">
      Multi-worker Node.js runner with exact O(1) bounded-memory histograms.
    </text>

    <!-- Key Feature Badges -->
    <g transform="translate(64, 252)">
      <!-- Badge 1 -->
      <g>
        <rect width="134" height="30" rx="15" fill="rgba(198,244,50,0.1)" stroke="rgba(198,244,50,0.3)" stroke-width="1"/>
        <text x="18" y="19" fill="#C6F432" font-size="11" font-weight="700" font-family="monospace">BOUNDED O(1)</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(144, 0)">
        <rect width="144" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="18" y="19" fill="#FFFFFF" font-size="11" font-weight="600" font-family="monospace">SSE STREAMING</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(298, 0)">
        <rect width="138" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="18" y="19" fill="#FFFFFF" font-size="11" font-weight="600" font-family="monospace">POSTGRES / JSON</text>
      </g>
    </g>
  </g>

  <!-- Right Side Interactive Architecture Nodes -->
  <g transform="translate(650, 68)" font-family="Inter, -apple-system, system-ui, sans-serif">
    <!-- Card 1: Configure -->
    <g transform="translate(0, 30)">
      <rect width="138" height="110" rx="14" fill="#141416" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect width="138" height="3" rx="1.5" fill="#C6F432"/>
      <circle cx="24" cy="28" r="5" fill="#C6F432"/>
      <text x="36" y="32" fill="#FFFFFF" font-size="13" font-weight="700">Configure</text>
      <text x="20" y="60" fill="#A1A1AA" font-size="11">Target &amp; Profile</text>
      <text x="20" y="80" fill="#71717A" font-size="10" font-family="monospace">1–20 VUs · Staged</text>
      <rect x="20" y="90" width="98" height="4" rx="2" fill="rgba(198,244,50,0.2)"/>
      <rect x="20" y="90" width="70" height="4" rx="2" fill="#C6F432"/>
    </g>

    <!-- Animated Data Packet Arrow 1 -->
    <path d="M142 85 H178" stroke="rgba(198,244,50,0.6)" stroke-width="2" class="packet-line"/>

    <!-- Card 2: Generate -->
    <g transform="translate(182, 30)">
      <rect width="144" height="110" rx="14" fill="#141416" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect width="144" height="3" rx="1.5" fill="#38BDF8"/>
      <circle cx="24" cy="28" r="5" fill="#38BDF8"/>
      <text x="36" y="32" fill="#FFFFFF" font-size="13" font-weight="700">Workers</text>
      <text x="20" y="60" fill="#A1A1AA" font-size="11">Child Processes</text>
      <text x="20" y="80" fill="#71717A" font-size="10" font-family="monospace">1, 2, or 4 workers</text>
      <text x="20" y="96" fill="#38BDF8" font-size="10" font-weight="600">IPC Interconnected</text>
    </g>

    <!-- Animated Data Packet Arrow 2 -->
    <path d="M330 85 H366" stroke="rgba(56,189,248,0.6)" stroke-width="2" class="packet-line"/>

    <!-- Card 3: Measure -->
    <g transform="translate(370, 30)">
      <rect width="138" height="110" rx="14" fill="#141416" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect width="138" height="3" rx="1.5" fill="#10B981"/>
      <circle cx="24" cy="28" r="5" fill="#10B981"/>
      <text x="36" y="32" fill="#FFFFFF" font-size="13" font-weight="700">Telemetry</text>
      <text x="20" y="60" fill="#A1A1AA" font-size="11">SSE Stream</text>
      <text x="20" y="80" fill="#10B981" font-size="10" font-weight="700" font-family="monospace">p50 / p95 / p99</text>
      <text x="20" y="96" fill="#71717A" font-size="10">Exact Histograms</text>
    </g>

    <!-- Feedback Flow Curve with animated packets -->
    <path d="M440 144 V184 H70 V144" fill="none" stroke="#C6F432" stroke-opacity="0.35" stroke-width="1.5" class="packet-line"/>
    <text x="255" y="178" fill="#A1A1AA" font-size="10" text-anchor="middle" font-family="monospace">Real-time live telemetry stream (SSE)</text>
  </g>
</svg>
