name: Performance Benchmark & Regression Check

on:
  push:
    branches:
      - main
      - phase-6-bounded-metrics
      - phase-7-distributed-runner
      - 'roadmap/**'
  pull_request:
    branches:
      - main
      - phase-6-bounded-metrics
      - phase-7-distributed-runner
      - 'roadmap/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging-quickstart:
    name: Packaging and quickstart (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run clean-install quickstart
        run: bash tools/quickstart-check.sh
      - name: Check local documentation links
        run: node tools/check-doc-links.js

  postgres-integration:
    name: PostgreSQL migrations and integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run PostgreSQL integration tests from an empty schema
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_test
        run: node --test tests/integration/postgres.test.js
      - name: Run database pool outage recovery scenario
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devflow_test
        run: node --test tests/integration/failure-injection.test.js

  correctness-tests:
    name: Unit & Integration Correctness Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup supported Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Run bounded two-minute soak check
        run: npm run soak:ci

      - name: Upload soak samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-ci-samples
          path: benchmarks/results/soak-*
          retention-days: 14

  benchmark-regression:
    name: Automated Benchmark & Performance Regression Gate
    runs-on: ubuntu-latest
    needs: correctness-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Run Controlled Benchmark (CI Profile)
        run: npm run bench:ci

      - name: Compare Benchmark Against Baseline
        id: compare
        run: npm run bench:compare

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-regression-report
          path: |
            data/ci-benchmark.json
            data/benchmark-report.md
            benchmarks/baseline.json
          retention-days: 14

