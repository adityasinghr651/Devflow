name: Feature request
description: Propose a focused improvement
body:
  - type: textarea
    id: need
    attributes: {label: What problem should this solve?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives considered}
