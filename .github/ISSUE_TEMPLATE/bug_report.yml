name: Bug report
description: Report a reproducible defect
body:
  - type: textarea
    id: problem
    attributes: {label: What happened?, description: Include expected and actual behavior.}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: DevFlow version and Node version}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Relevant logs, description: Remove tokens and personal data before posting.}
